name: Weekly Cycle Time Report

on:
  schedule:
    # Every Monday at 08:00 UTC (09:00 Lisbon winter / 09:00 BST)
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      week_end_date:
        description: 'End date for the 12-week window (YYYY-MM-DD). Leave empty for today.'
        required: false
        default: ''

jobs:
  report:
    name: report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests python-dateutil openpyxl

      - name: Run Cycle Time Report
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "${{ github.event.inputs.week_end_date }}" ]; then
            python cycle_time.py "${{ github.event.inputs.week_end_date }}"
          else
            python cycle_time.py
          fi

      - name: Post Set up Python
        uses: actions/setup-python@v5
        if: always()
        with:
          python-version: '3.11'
